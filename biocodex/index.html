<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biocodex – Paires de cartes</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #592881;
    --purple-dark: #421d61;
    --magenta: #b81a85;
    --magenta-light: #f8e6f2;
    --lime: #cedd54;
    --lime-light: #f6f9e1;
    --grey: #5a554d;
    --bg: #f7f5f8;
    --surface: #ffffff;
    --border: #e6e0ea;
    --text: #2e2a33;
    --text-muted: #7b7482;
    --radius: 14px;
    --shadow: 0 4px 22px rgba(89,40,129,.08);
    --transition: .28s cubic-bezier(.4,0,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Mulish', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: clamp(16px, 4vw, 32px) clamp(12px, 4vw, 16px) 48px;
    min-height: 100vh;
  }
  .widget-section { max-width: 860px; margin: 0 auto; }

  /* En-tête façon biocodex.fr */
  .intro { margin-bottom: clamp(14px, 2.5vw, 22px); }
  .eyebrow {
    font-size: .72rem; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; color: var(--magenta);
  }
  .intro h1 {
    font-weight: 300; color: var(--grey);
    font-size: clamp(1.4rem, 4vw, 2rem); margin-top: 4px;
  }
  .intro h1::after {
    content: ''; display: block; width: 34px; height: 5px;
    background: var(--lime); margin-top: 8px;
  }
  .intro p { margin-top: 12px; font-size: .9rem; color: var(--text-muted); line-height: 1.5; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: clamp(16px, 3vw, 28px);
    display: flex; flex-direction: column;
  }

  .memory-header {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-bottom: clamp(14px, 2vw, 20px);
    flex-wrap: wrap; gap: 10px;
  }
  .memory-stats {
    display: flex; gap: clamp(10px, 3vw, 20px);
    font-size: clamp(.75rem, 2vw, .85rem); color: var(--text-muted); flex-wrap: wrap;
  }
  .memory-stats span strong { color: var(--magenta); font-weight: 800; }
  .memory-btn {
    background: var(--purple); color: #fff; border: none;
    border-radius: 999px; padding: 8px 18px; font-size: .8rem;
    font-weight: 700; cursor: pointer; font-family: inherit;
    letter-spacing: .02em;
    transition: background var(--transition); white-space: nowrap;
  }
  .memory-btn:hover { background: var(--magenta); }

  .memory-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px, 1.5vw, 12px);
  }
  @media (max-width: 500px) {
    .memory-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .mem-card {
    height: clamp(90px, 18vw, 150px);
    cursor: pointer; perspective: 600px;
    -webkit-tap-highlight-color: transparent;
  }
  @media (max-width: 500px) {
    .mem-card { height: clamp(100px, 36vw, 160px); }
  }

  /* Coin bas-gauche très arrondi, rappel des visuels Biocodex */
  .mem-card-inner, .mem-front, .mem-back { border-radius: 10px 10px 10px 42px; }

  .mem-card-inner {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
  }
  .mem-card:hover:not(.revealed):not(.matched) .mem-card-inner { transform: translateY(-2px); }
  .mem-card.revealed .mem-card-inner,
  .mem-card.matched .mem-card-inner { transform: rotateY(180deg); }

  .mem-front, .mem-back {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .mem-front {
    background: linear-gradient(140deg, var(--purple) 0%, var(--purple-dark) 100%);
    font-size: clamp(1.2rem, 3vw, 1.5rem); color: #fff;
    overflow: hidden;
  }
  /* Petite pastille magenta, rappel du logo */
  .mem-front::before {
    content: ''; position: absolute; top: 10px; right: 10px;
    width: 12px; height: 10px; background: var(--magenta);
    border-radius: 3px 6px 6px 3px;
  }
  .mem-front::after {
    content: ''; position: absolute; left: 50%; bottom: 14px;
    transform: translateX(-50%); width: 22px; height: 3px; background: var(--lime);
  }
  .mem-back {
    background: var(--surface);
    border: 1.5px solid var(--border);
    transform: rotateY(180deg);
    font-size: clamp(.62rem, 1.4vw, .74rem); font-weight: 600; color: var(--text);
    text-align: center; padding: clamp(6px, 1.5vw, 10px); line-height: 1.35;
  }
  .mem-back.is-term {
    color: var(--magenta); font-weight: 800;
    font-size: clamp(.7rem, 1.6vw, .85rem);
  }
  .mem-card.matched .mem-back {
    border-color: var(--lime); background: var(--lime-light); color: var(--purple);
  }

  #mem-win {
    display: none; text-align: center; margin-top: 18px;
    font-weight: 800; color: var(--purple); font-size: .95rem;
  }
  #mem-win span { color: var(--magenta); }
</style>
</head>
<body>
<div class="widget-section">
  <div class="intro">
    <div class="eyebrow">Nous rejoindre</div>
    <h1>Agir avec Sens. Innover avec Soin.</h1>
    <p>Associez chaque engagement Biocodex à sa description pour découvrir ce qui fait la différence au quotidien.</p>
  </div>

  <div class="card">
    <div class="memory-header">
      <div class="memory-stats">
        <span>Paires : <strong id="mem-pairs">0 / 4</strong></span>
        <span>Essais : <strong id="mem-tries">0</strong></span>
      </div>
      <button class="memory-btn" onclick="initMemory()">↺ Rejouer</button>
    </div>
    <div class="memory-grid-wrap">
      <div class="memory-grid" id="memory-grid"></div>
      <div id="mem-win">🏆 Bravo ! Toutes les paires sont trouvées. <span>Prêt·e à nous rejoindre ?</span></div>
    </div>
  </div>
</div>

<script>
const memPairs = [
  { id: 1, type:'term', text: 'Conditions de travail',       emoji:'🏠' },
  { id: 1, type:'def',  text: "Jusqu'à 2 jours de télétravail par semaine et flex office", emoji: null },
  { id: 2, type:'term', text: 'Plan Individuel de Développement', emoji:'📈' },
  { id: 2, type:'def',  text: 'Développer les compétences souhaitées pour son projet professionnel', emoji: null },
  { id: 3, type:'term', text: 'Engagements RSE',             emoji:'🌍' },
  { id: 3, type:'def',  text: "Réduire de 30 % l'empreinte carbone d'ici 2032 (vs 2022)", emoji: null },
  { id: 4, type:'term', text: 'Index égalité femmes-hommes', emoji:'⚖️' },
  { id: 4, type:'def',  text: '97 / 100 pour Biocodex SAS en 2025', emoji: null },
];

const TOTAL = memPairs.length / 2;
let revealed = [], matched = [], tries = 0, isLocked = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initMemory() {
  revealed = []; matched = []; tries = 0; isLocked = false;
  document.getElementById('mem-pairs').textContent = `0 / ${TOTAL}`;
  document.getElementById('mem-tries').textContent = '0';
  document.getElementById('mem-win').style.display = 'none';
  const grid = document.getElementById('memory-grid');
  grid.innerHTML = '';
  shuffle(memPairs).forEach(item => {
    const card = document.createElement('div');
    card.className = 'mem-card';
    card.dataset.id = item.id;
    card.dataset.type = item.type;
    card.innerHTML = `<div class="mem-card-inner">
      <div class="mem-front">${item.emoji || '?'}</div>
      <div class="mem-back ${item.type === 'term' ? 'is-term' : ''}">${item.text}</div>
    </div>`;
    card.addEventListener('click', () => flipMemCard(card));
    grid.appendChild(card);
  });
}

function flipMemCard(card) {
  if (isLocked || card.classList.contains('matched') || card.classList.contains('revealed') || revealed.length >= 2) return;
  card.classList.add('revealed');
  revealed.push(card);
  if (revealed.length === 2) {
    isLocked = true;
    tries++;
    document.getElementById('mem-tries').textContent = tries;
    setTimeout(checkMatch, 1000);
  }
}

function checkMatch() {
  const [a, b] = revealed;
  if (a.dataset.id === b.dataset.id && a.dataset.type !== b.dataset.type) {
    a.classList.add('matched'); b.classList.add('matched');
    matched.push(a, b);
    const pairCount = matched.length / 2;
    document.getElementById('mem-pairs').textContent = `${pairCount} / ${TOTAL}`;
    if (pairCount === TOTAL) document.getElementById('mem-win').style.display = 'block';
  } else {
    a.classList.remove('revealed'); b.classList.remove('revealed');
  }
  revealed = [];
  isLocked = false;
}

initMemory();
</script>
</body>
</html>
